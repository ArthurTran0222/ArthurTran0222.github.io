<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d1a"/>
      <stop offset="50%" stop-color="#18231f"/>
      <stop offset="100%" stop-color="#0d1411"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p1Bg)"/>
  <rect x="20" y="20" width="560" height="320" rx="8" fill="none" stroke="rgba(181, 154, 99, 0.3)" stroke-width="1.5"/>
  
  <!-- Đồ họa kiếm ấn và module code -->
  <g transform="translate(60, 60)">
    <rect width="480" height="40" rx="4" fill="#1e2c26" stroke="#22322c"/>
    <circle cx="20" cy="20" r="5" fill="#b54738"/>
    <circle cx="36" cy="20" r="5" fill="#b59a63"/>
    <circle cx="52" cy="20" r="5" fill="#6f8f7a"/>
    <text x="80" y="25" fill="#c8d3ca" font-family="'JetBrains Mono', monospace" font-size="13">cuu-kiem-core // Clean Architecture Monorepo</text>
  </g>

  <g transform="translate(60, 120)">
    <rect width="220" height="180" rx="6" fill="#18231f" stroke="#22322c"/>
    <text x="20" y="35" fill="#cfb882" font-family="'Noto Serif', serif" font-size="16" font-weight="bold">Tâm Pháp (Domain)</text>
    <line x1="20" y1="48" x2="200" y2="48" stroke="rgba(181, 154, 99, 0.2)"/>
    <text x="20" y="80" fill="#c8d3ca" font-family="'JetBrains Mono', monospace" font-size="12">• Entities &amp; Rules</text>
    <text x="20" y="110" fill="#c8d3ca" font-family="'JetBrains Mono', monospace" font-size="12">• Zero Dependencies</text>
    <text x="20" y="140" fill="#c8d3ca" font-family="'JetBrains Mono', monospace" font-size="12">• Pure Business Logic</text>
  </g>

  <g transform="translate(320, 120)">
    <rect width="220" height="180" rx="6" fill="#18231f" stroke="#22322c"/>
    <text x="20" y="35" fill="#cfb882" font-family="'Noto Serif', serif" font-size="16" font-weight="bold">Kiếm Chiêu (Adapters)</text>
    <line x1="20" y1="48" x2="200" y2="48" stroke="rgba(181, 154, 99, 0.2)"/>
    <text x="20" y="80" fill="#c8d3ca" font-family="'JetBrains Mono', monospace" font-size="12">• Fast Static Engine</text>
    <text x="20" y="110" fill="#c8d3ca" font-family="'JetBrains Mono', monospace" font-size="12">• TypeScript Strict</text>
    <text x="20" y="140" fill="#c8d3ca" font-family="'JetBrains Mono', monospace" font-size="12">• Automated Pipeline</text>
  </g>

  <!-- Dấu triện [Nội dung mẫu] -->
  <rect x="440" y="30" width="120" height="24" rx="3" fill="rgba(181, 71, 56, 0.2)" stroke="#b54738"/>
  <text x="500" y="46" fill="#e06251" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">NỘI DUNG MẪU</text>
</svg>
