<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18231f"/>
      <stop offset="60%" stop-color="#141d1a"/>
      <stop offset="100%" stop-color="#0d1411"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p2Bg)"/>
  <rect x="20" y="20" width="560" height="320" rx="8" fill="none" stroke="rgba(111, 143, 122, 0.3)" stroke-width="1.5"/>

  <!-- Thành phần giao diện Sơn Thủy UI -->
  <g transform="translate(60, 60)">
    <rect width="480" height="34" rx="4" fill="#22322c"/>
    <text x="20" y="22" fill="#cfb882" font-family="'Noto Serif', serif" font-size="14" font-weight="bold">Sơn Thủy Design System // Tokens &amp; Components</text>
  </g>

  <g transform="translate(60, 115)">
    <!-- Palette swatches -->
    <rect x="0" y="0" width="85" height="70" rx="4" fill="#111916" stroke="#b59a63"/>
    <text x="42" y="40" fill="#f2ebdd" font-size="11" font-family="'JetBrains Mono'" text-anchor="middle">Mực Tàu</text>
    <rect x="95" y="0" width="85" height="70" rx="4" fill="#f2ebdd"/>
    <text x="137" y="40" fill="#111916" font-size="11" font-family="'JetBrains Mono'" text-anchor="middle">Giấy Xuyến</text>
    <rect x="190" y="0" width="85" height="70" rx="4" fill="#c8d3ca"/>
    <text x="232" y="40" fill="#111916" font-size="11" font-family="'JetBrains Mono'" text-anchor="middle">Sương Lam</text>
    <rect x="285" y="0" width="85" height="70" rx="4" fill="#6f8f7a"/>
    <text x="327" y="40" fill="#ffffff" font-size="11" font-family="'JetBrains Mono'" text-anchor="middle">Ngọc Bích</text>
    <rect x="380" y="0" width="85" height="70" rx="4" fill="#b54738"/>
    <text x="422" y="40" fill="#ffffff" font-size="11" font-family="'JetBrains Mono'" text-anchor="middle">Chu Sa</text>
  </g>

  <g transform="translate(60, 205)">
    <rect width="480" height="95" rx="6" fill="#1b2823" stroke="#22322c"/>
    <text x="20" y="35" fill="#f2ebdd" font-family="'Noto Serif', serif" font-size="15">Nét bút thanh thoát, đáp ứng chuẩn WCAG AA</text>
    <text x="20" y="65" fill="#c8d3ca" font-family="'Be Vietnam Pro', sans-serif" font-size="13">Hệ thống thành phần CSS thuần, không phụ thuộc thư viện cồng kềnh.</text>
  </g>

  <!-- Dấu triện [Nội dung mẫu] -->
  <rect x="440" y="30" width="120" height="24" rx="3" fill="rgba(181, 71, 56, 0.2)" stroke="#b54738"/>
  <text x="500" y="46" fill="#e06251" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">NỘI DUNG MẪU</text>
</svg>
