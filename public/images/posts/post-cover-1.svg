<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18231f"/>
      <stop offset="50%" stop-color="#141d1a"/>
      <stop offset="100%" stop-color="#0d1411"/>
    </linearGradient>
    <radialGradient id="sunMoon" cx="80%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#cfb882" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#b59a63" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#141d1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#coverBg)"/>
  <!-- Trăng mờ sương -->
  <circle cx="640" cy="130" r="80" fill="url(#sunMoon)"/>

  <!-- Dãy núi sơn thủy phủ sương -->
  <path d="M0,260 Q150,160 300,230 T600,180 T800,220 L800,450 L0,450 Z" fill="#1b2823" opacity="0.6"/>
  <path d="M0,320 Q200,240 400,280 T800,250 L800,450 L0,450 Z" fill="#111916"/>

  <!-- Nét kiếm khí vàng & vệt mực -->
  <path d="M120,380 Q350,220 680,180" stroke="#cfb882" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Tiêu đề & Triện ấn trong ảnh -->
  <rect x="60" y="70" width="50" height="50" rx="4" fill="#b54738" stroke="#cfb882" stroke-width="1.5"/>
  <text x="85" y="102" fill="#ffffff" font-family="'Noto Serif', serif" font-size="24" font-weight="bold" text-anchor="middle">道</text>
  
  <text x="130" y="95" fill="#f2ebdd" font-family="'Noto Serif', serif" font-size="26" font-weight="bold">Khởi Đầu Hành Trình Lập Trình</text>
  <text x="130" y="125" fill="#c8d3ca" font-family="'Be Vietnam Pro', sans-serif" font-size="14">Bút ký kiếm hiệp // Arthur Heisenberg</text>
</svg>
